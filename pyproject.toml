[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ypc-settlement"
version = "0.1.0"
description = "Exact poker ledger settlement optimizer with payment-rail constraints and tail-balanced payment fanout."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ypc-settle = "ypc_settlement.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
